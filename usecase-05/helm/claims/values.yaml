nameOverride: ""
fullnameOverride: ""

backend:
  replicaCount: 1
  image:
    repository: host.docker.internal:8082/claims/claims-backend
    tag: "8e5c277"
    pullPolicy: IfNotPresent
  containerPort: 5000
  service:
    port: 5000
  readinessProbe:
    path: /api/health
    initialDelaySeconds: 10
    periodSeconds: 5
  livenessProbe:
    path: /api/health
    initialDelaySeconds: 30
    periodSeconds: 10

frontend:
  replicaCount: 1
  image:
    repository: claims-frontend
    tag: "k8s"
    pullPolicy: IfNotPresent
  containerPort: 80
  service:
    port: 80
  readinessProbe:
    path: /
    initialDelaySeconds: 5
    periodSeconds: 5
  livenessProbe:
    path: /
    initialDelaySeconds: 15
    periodSeconds: 10

database:
  replicaCount: 1
  image:
    repository: postgres
    tag: "17"
    pullPolicy: IfNotPresent
  containerPort: 5432
  service:
    port: 5432
  name: claimsdb
  user: claimsuser
  existingSecret: claims-db-secret
  backendPasswordKey: DB_PASSWORD
  postgresPasswordKey: POSTGRES_PASSWORD
  storage:
    size: 1Gi
    storageClassName: standard
    accessMode: ReadWriteOnce

config:
  dbHost: claims-db
  dbPort: "5432"
  dbName: claimsdb
  dbUser: claimsuser

ingress:
  enabled: true
  className: nginx
  host: claims-gitops.localhost
  backendPath: /api
  frontendPath: /