apiVersion: v1
kind: Service
metadata:
  name: claims-db
  namespace: {{ .Release.Namespace }}
  labels:
    app: claims-db
spec:
  type: ClusterIP
  selector:
    app: claims-db
  ports:
    - name: postgres
      port: {{ .Values.database.service.port }}
      targetPort: {{ .Values.database.containerPort }}
      protocol: TCP