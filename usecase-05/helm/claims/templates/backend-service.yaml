apiVersion: v1
kind: Service
metadata:
  name: claims-backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: claims-backend
spec:
  type: ClusterIP
  selector:
    app: claims-backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: {{ .Values.backend.containerPort }}
      protocol: TCP