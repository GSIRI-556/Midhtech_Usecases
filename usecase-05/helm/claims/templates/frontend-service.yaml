apiVersion: v1
kind: Service
metadata:
  name: claims-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: claims-frontend
spec:
  type: ClusterIP
  selector:
    app: claims-frontend
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.containerPort }}
      protocol: TCP
