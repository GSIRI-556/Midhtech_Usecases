apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: claims-gitops
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://gitlab.com/midh-group/3-Tier-Architecture_UseCases.git
    targetRevision: Usecase_05
    path: usecase-05/helm/claims
    helm:
      valueFiles:
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: claims-gitops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true