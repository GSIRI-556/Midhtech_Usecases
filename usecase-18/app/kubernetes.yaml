apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase18-demo
  namespace: claims-logging-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usecase18-demo
  template:
    metadata:
      labels:
        app: usecase18-demo
    spec:
      containers:
        - name: application
          image: python:3.12-slim
          command: ["python", "/app/app.py"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: application-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: application-code
          configMap:
            name: usecase18-app
---
apiVersion: v1
kind: Service
metadata:
  name: usecase18-demo
  namespace: claims-logging-lab
spec:
  selector:
    app: usecase18-demo
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  type: ClusterIP
