apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase14-bad
  namespace: claims-k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usecase14-demo
      version: bad
  template:
    metadata:
      labels:
        app: usecase14-demo
        version: bad
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /deliberately-unhealthy
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
