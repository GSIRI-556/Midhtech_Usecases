apiVersion: v1
kind: ConfigMap
metadata:
  name: usecase14-green-content
  namespace: claims-k8s-lab
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Green Environment</title></head>
    <body>
      <h1>GREEN Version 2</h1>
      <p>New release candidate</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase14-green
  namespace: claims-k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usecase14-demo
      version: green
  template:
    metadata:
      labels:
        app: usecase14-demo
        version: green
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: green-content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: green-content
          configMap:
            name: usecase14-green-content
