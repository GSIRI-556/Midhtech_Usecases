apiVersion: v1
kind: ConfigMap
metadata:
  name: usecase14-blue-content
  namespace: claims-k8s-lab
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <head><title>Blue Environment</title></head>
    <body>
      <h1>BLUE Version 1</h1>
      <p>Stable release</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase14-blue
  namespace: claims-k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usecase14-demo
      version: blue
  template:
    metadata:
      labels:
        app: usecase14-demo
        version: blue
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: blue-content
              mountPath: /usr/share/nginx/html
      volumes:
        - name: blue-content
          configMap:
            name: usecase14-blue-content
---
apiVersion: v1
kind: Service
metadata:
  name: usecase14-service
  namespace: claims-k8s-lab
spec:
  selector:
    app: usecase14-demo
    version: blue
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
