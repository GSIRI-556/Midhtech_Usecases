apiVersion: v1
kind: ConfigMap
metadata:
  name: usecase16-config
  namespace: claims-drift-lab
data:
  APP_ENV: "drift-lab"
  APP_NAME: "usecase16-demo"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase16-demo
  namespace: claims-drift-lab
  labels:
    app: usecase16-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: usecase16-demo
  template:
    metadata:
      labels:
        app: usecase16-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          envFrom:
            - configMapRef:
                name: usecase16-config
---
apiVersion: v1
kind: Service
metadata:
  name: usecase16-demo
  namespace: claims-drift-lab
spec:
  selector:
    app: usecase16-demo
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
