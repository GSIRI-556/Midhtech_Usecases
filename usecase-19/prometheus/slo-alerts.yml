groups:
  - name: claims-demo-slo
    interval: 30s
    rules:
      - alert: ClaimsDemoSLOBudgetWarning
        expr: |
          (
            100 *
            sum(increase(claims_demo_http_requests_total{status!="200"}[30d]))
            /
            sum(increase(claims_demo_http_requests_total[30d]))
          ) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Claims demo has consumed 50% of its error budget"
          description: "The 30-day error rate is above 0.5%, consuming more than half of the 1% error budget."

      - alert: ClaimsDemoSLOBudgetCritical
        expr: |
          (
            100 *
            sum(increase(claims_demo_http_requests_total{status!="200"}[30d]))
            /
            sum(increase(claims_demo_http_requests_total[30d]))
          ) > 0.8
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Claims demo has consumed 80% of its error budget"
          description: "The 30-day error rate is above 0.8%, consuming more than 80% of the 1% error budget."
