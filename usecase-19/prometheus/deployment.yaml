apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase19-prometheus
  namespace: claims-logging-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usecase19-prometheus
  template:
    metadata:
      labels:
        app: usecase19-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
              readOnly: true
            - name: prometheus-data
              mountPath: /prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: usecase19-prometheus-config
        - name: prometheus-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: usecase19-prometheus
  namespace: claims-logging-lab
spec:
  selector:
    app: usecase19-prometheus
  ports:
    - name: web
      port: 9090
      targetPort: 9090
  type: ClusterIP
