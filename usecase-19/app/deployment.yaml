apiVersion: apps/v1
kind: Deployment
metadata:
  name: usecase19-demo
  namespace: claims-logging-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: usecase19-demo
  template:
    metadata:
      labels:
        app: usecase19-demo
    spec:
      containers:
        - name: application
          image: python:3.12-slim
          command: ["python", "/app/app.py"]
          ports:
            - containerPort: 8080
          env:
            - name: SERVICE
              value: claims-demo
            - name: ENVIRONMENT
              value: usecase19
            - name: VERSION
              value: "1.0.0"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: app-code
              mountPath: /app
              readOnly: true
      volumes:
        - name: app-code
          configMap:
            name: usecase19-app
---
apiVersion: v1
kind: Service
metadata:
  name: usecase19-demo
  namespace: claims-logging-lab
spec:
  selector:
    app: usecase19-demo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
  type: ClusterIP
