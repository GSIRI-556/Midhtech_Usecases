
apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-frontend
  namespace: claims-k8s-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: claims-frontend
  template:
    metadata:
      labels:
        app: claims-frontend
    spec:
      containers:
        - name: frontend
          image: claims-frontend:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
